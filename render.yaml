services:
  - type: web
    name: tradingagents
    env: python
    plan: free
    buildCommand: pip install ".[web]"
    startCommand: python webapp/server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: TRADINGAGENTS_LLM_PROVIDER
        value: google
      - key: TRADINGAGENTS_DEEP_THINK_LLM
        value: gemini-3.5-flash-lite
      - key: TRADINGAGENTS_QUICK_THINK_LLM
        value: gemini-3.5-flash-lite
      - key: GOOGLE_API_KEY
        sync: false
      - key: WEBAPP_PASSWORD
        sync: false
