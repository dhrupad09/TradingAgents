<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TradingAgents</title>
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115; color: #e8e9ec; min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; font-weight: 700; margin: 8px 0 20px; display: flex; align-items: center; gap: 8px; }
  .card { background: #1a1d24; border: 1px solid #2a2e38; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: #9aa0ad; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2e38;
    background: #0f1115; color: #e8e9ec; font-size: 16px; margin-bottom: 14px;
  }
  input:focus { outline: 2px solid #4f7cff; }
  button {
    width: 100%; padding: 14px; border-radius: 10px; border: none; background: #4f7cff;
    color: white; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button:disabled { background: #2a2e38; color: #6b7280; }
  button.secondary { background: #2a2e38; color: #c7cad1; }
  .linkbtn {
    display: block; width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #a8823a;
    background: transparent; color: #d4ae62; font-size: 16px; font-weight: 600; text-align: center;
    text-decoration: none; box-sizing: border-box;
  }
  .status { margin-top: 14px; font-size: 14px; color: #9aa0ad; display: flex; align-items: center; gap: 8px; }
  .spinner {
    width: 14px; height: 14px; border: 2px solid #2a2e38; border-top-color: #4f7cff;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .decision {
    font-size: 15px; font-weight: 700; padding: 10px 14px; border-radius: 10px; margin-bottom: 10px;
    display: inline-block;
  }
  .decision.buy, .decision.overweight { background: #1d3a26; color: #4ade80; }
  .decision.sell, .decision.underweight { background: #3a1d1d; color: #f87171; }
  .decision.hold, .decision.review { background: #3a331d; color: #facc15; }
  .providers { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .provchip { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; border: 1px solid #2a2e38; background: #0f1115; font-size: 13px; cursor: pointer; user-select: none; }
  .provchip.off { opacity: .4; cursor: not-allowed; }
  .provchip input { width: auto; margin: 0; }
  .provhead { font-size: 12px; color: #9aa0ad; margin-bottom: 8px; }
  .providercard { border: 1px solid #2a2e38; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .providercard .phead { padding: 10px 14px; background: #1a1d24; font-size: 13px; font-weight: 700; color: #9aa0ad; display: flex; justify-content: space-between; align-items: center; }
  .providercard .pbody { padding: 12px 14px; }
  details { margin-bottom: 10px; border: 1px solid #2a2e38; border-radius: 10px; overflow: hidden; }
  summary { padding: 12px 14px; cursor: pointer; font-size: 14px; font-weight: 600; background: #1a1d24; }
  .report-body { padding: 0 14px 14px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; color: #c7cad1; }
  .error { color: #f87171; font-size: 14px; white-space: pre-wrap; }
  #pwGate { position: fixed; inset: 0; background: #0f1115; display: flex; align-items: center; justify-content: center; padding: 20px; }
  #pwGate .card { width: 100%; max-width: 360px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="pwGate" hidden>
  <div class="card">
    <h1>🔒 TradingAgents</h1>
    <label for="pwInput">Password</label>
    <input id="pwInput" type="password" autocomplete="current-password">
    <button id="pwSubmit">Unlock</button>
    <div class="error" id="pwError" hidden>Wrong password.</div>
  </div>
</div>

<div class="wrap" id="main" hidden>
  <h1>📈 TradingAgents</h1>

  <div class="card">
    <label for="ticker">Ticker</label>
    <input id="ticker" type="text" value="NVDA" autocapitalize="characters" autocomplete="off">
    <label for="date">Analysis date</label>
    <input id="date" type="date">
    <div class="provhead">Compare across models (applies to Full Analysis &amp; Market Brief)</div>
    <div class="providers" id="providers"><span style="font-size:13px;color:#6b7280">Loading providers…</span></div>
    <button id="quickBtn" class="secondary">⚡ Quick Signal (instant, free)</button>
    <div style="height:10px"></div>
    <button id="runBtn">Run Full Analysis</button>
    <div style="height:10px"></div>
    <button id="briefBtn" class="secondary">📰 Market Brief (whole market, 1 LLM call)</button>
    <div class="status" id="statusLine" hidden>
      <div class="spinner"></div>
      <span id="statusText">Starting…</span>
    </div>
  </div>

  <div class="card">
    <a href="https://claude.ai/artifact/Ess1Co14BakoNdvFrWEZ1S" target="_blank" rel="noopener" class="linkbtn">
      🏛️ Open Daily Market Brief (Claude Artifact) ↗
    </a>
    <div style="font-size:12px;color:#6b7280;margin-top:8px">
      Your real Robinhood-powered brief, opens on claude.ai in a new tab — sign in with your Claude account there.
    </div>
  </div>

  <div id="result"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function getPassword() {
  try { return localStorage.getItem('ta_password') || ''; } catch (e) { return ''; }
}
function setPassword(p) {
  try { localStorage.setItem('ta_password', p); } catch (e) {}
}

async function api(path, opts = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json', 'X-Password': getPassword() }, opts.headers || {});
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  if (res.status === 401) throw new Error('UNAUTHORIZED');
  if (!res.ok) throw new Error('Request failed: ' + res.status);
  return res.json();
}

function showGate(show) {
  $('pwGate').hidden = !show;
  $('main').hidden = show;
}

async function tryUnlock(pw) {
  setPassword(pw);
  try {
    await api('/api/status/_probe');
    showGate(false);
    loadProviders();
  } catch (e) {
    if (e.message === 'UNAUTHORIZED') {
      $('pwError').hidden = false;
      showGate(true);
    } else {
      // probe 404 (unknown job) still means auth passed
      showGate(false);
      loadProviders();
    }
  }
}

$('pwSubmit').addEventListener('click', () => tryUnlock($('pwInput').value));

let PROVIDERS = [];

async function loadProviders() {
  try {
    const { providers } = await api('/api/providers');
    PROVIDERS = providers;
    $('providers').innerHTML = providers.map(p => `
      <label class="provchip ${p.available ? '' : 'off'}" title="${p.available ? '' : 'Add ' + p.label + ' API key to .env to enable'}">
        <input type="checkbox" value="${p.provider}" ${p.available ? '' : 'disabled'} ${p.available ? 'checked' : ''}>
        ${p.label}${p.available ? '' : ' (no key)'}
      </label>`).join('');
  } catch (e) {
    $('providers').innerHTML = '<span style="font-size:13px;color:#f87171">Could not load providers.</span>';
  }
}

function selectedProviders() {
  return Array.from($('providers').querySelectorAll('input[type=checkbox]:checked')).map(el => el.value);
}

function decisionClass(decision) {
  const d = (decision || '').toLowerCase();
  if (d.includes('buy') || d.includes('overweight')) return 'buy';
  if (d.includes('sell') || d.includes('underweight')) return 'sell';
  return 'hold';
}

function renderOneAnalysis(container, r) {
  if (r.status === 'running') {
    container.innerHTML = `<div class="status" style="margin:0"><div class="spinner"></div><span>Analyzing…</span></div>`;
    return;
  }
  if (r.status === 'error') {
    container.innerHTML = `<div class="error">${r.error}</div>`;
    return;
  }
  const sections = [
    ['Final decision rationale', r.final_trade_decision],
    ["Trader's plan", r.trader_investment_plan],
    ['Fundamentals', r.fundamentals_report],
    ['Technical / market', r.market_report],
    ['News & macro', r.news_report],
    ['Sentiment', r.sentiment_report],
  ];
  container.innerHTML = `<div class="decision ${decisionClass(r.decision)}">${r.decision || 'REVIEW'}</div>`;
  for (const [title, body] of sections) {
    if (!body) continue;
    const d = document.createElement('details');
    d.innerHTML = `<summary>${title}</summary><div class="report-body"></div>`;
    d.querySelector('.report-body').textContent = body;
    container.appendChild(d);
  }
}

function renderResult(job) {
  const box = $('result');
  if (job.status === 'error') {
    box.innerHTML = `<div class="card error">${job.error}</div>`;
    return;
  }
  // Quick Signal returns a flat shape (no provider involved).
  if (!job.results) {
    box.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'card';
    renderOneAnalysis(card, job);
    box.appendChild(card);
    return;
  }
  // Multi-provider comparison shape.
  box.innerHTML = '';
  for (const [provider, r] of Object.entries(job.results)) {
    const card = document.createElement('div');
    card.className = 'providercard';
    const head = document.createElement('div');
    head.className = 'phead';
    head.textContent = r.label || provider;
    const body = document.createElement('div');
    body.className = 'pbody';
    renderOneAnalysis(body, r);
    card.appendChild(head);
    card.appendChild(body);
    box.appendChild(card);
  }
}

function renderOneBrief(container, b) {
  if (b.status === 'error') {
    container.innerHTML = `<div class="error">${b.error}</div>`;
    return;
  }
  const why = (b.why || []).map(x => `<li>${x}</li>`).join('');
  container.innerHTML = `
    <p style="margin:0 0 10px">${b.summary || ''}</p>
    ${why ? `<ul style="margin:0 0 10px;padding-left:18px">${why}</ul>` : ''}
    ${b.rotation ? `<p style="margin:0 0 10px"><b>Where the money is going:</b> ${b.rotation}</p>` : ''}
    ${b.watch ? `<p style="margin:0 0 10px"><b>What to watch:</b> ${b.watch}</p>` : ''}
    ${b.unknown ? `<p style="margin:0;font-size:12px;color:#9aa0ad">${b.unknown}</p>` : ''}`;
}

function renderBrief(b) {
  const box = $('result');
  if (b.status === 'error') {
    box.innerHTML = `<div class="card error">${b.error}</div>`;
    return;
  }
  box.innerHTML = '';
  const idxCard = document.createElement('div');
  idxCard.className = 'card';
  idxCard.innerHTML = (b.indexes || []).map(l => `<div style="font-size:13px;color:#9aa0ad">${l}</div>`).join('');
  box.appendChild(idxCard);
  for (const [provider, r] of Object.entries(b.results || {})) {
    const card = document.createElement('div');
    card.className = 'providercard';
    const head = document.createElement('div');
    head.className = 'phead';
    head.textContent = r.label || provider;
    const body = document.createElement('div');
    body.className = 'pbody';
    renderOneBrief(body, r);
    card.appendChild(head);
    card.appendChild(body);
    box.appendChild(card);
  }
}

$('briefBtn').addEventListener('click', async () => {
  const date = $('date').value;
  if (!date) return;
  $('quickBtn').disabled = true;
  $('runBtn').disabled = true;
  $('briefBtn').disabled = true;
  $('statusLine').hidden = false;
  $('statusText').textContent = 'Reading the market and writing the brief…';
  $('result').innerHTML = '';
  try {
    const b = await api('/api/brief', { method: 'POST', body: JSON.stringify({ date, providers: selectedProviders() }) });
    $('statusLine').hidden = true;
    renderBrief(b);
  } catch (e) {
    $('statusLine').hidden = true;
    $('result').innerHTML = `<div class="card error">${e.message}</div>`;
  } finally {
    $('quickBtn').disabled = false;
    $('runBtn').disabled = false;
    $('briefBtn').disabled = false;
  }
});

async function pollJob(jobId) {
  while (true) {
    const job = await api('/api/status/' + jobId);
    renderResult(job);
    if (job.status === 'running') {
      $('statusText').textContent = 'Agents are analyzing… this can take a few minutes';
      await new Promise(r => setTimeout(r, 3000));
      continue;
    }
    $('statusLine').hidden = true;
    $('runBtn').disabled = false;
    return;
  }
}

$('runBtn').addEventListener('click', async () => {
  const ticker = $('ticker').value.trim();
  const date = $('date').value;
  if (!ticker || !date) return;
  $('runBtn').disabled = true;
  $('statusLine').hidden = false;
  $('statusText').textContent = 'Starting…';
  $('result').innerHTML = '';
  try {
    const { job_id } = await api('/api/analyze', { method: 'POST', body: JSON.stringify({ ticker, date, providers: selectedProviders() }) });
    await pollJob(job_id);
  } catch (e) {
    $('statusLine').hidden = true;
    $('runBtn').disabled = false;
    $('result').innerHTML = `<div class="card error">${e.message}</div>`;
  }
});

$('quickBtn').addEventListener('click', async () => {
  const ticker = $('ticker').value.trim();
  const date = $('date').value;
  if (!ticker || !date) return;
  $('quickBtn').disabled = true;
  $('runBtn').disabled = true;
  $('statusLine').hidden = false;
  $('statusText').textContent = 'Computing…';
  $('result').innerHTML = '';
  try {
    const job = await api('/api/quick', { method: 'POST', body: JSON.stringify({ ticker, date }) });
    $('statusLine').hidden = true;
    renderResult(job);
  } catch (e) {
    $('result').innerHTML = `<div class="card error">${e.message}</div>`;
  } finally {
    $('quickBtn').disabled = false;
    $('runBtn').disabled = false;
  }
});

(function init() {
  $('date').value = new Date().toISOString().slice(0, 10);
  if (getPassword()) {
    tryUnlock(getPassword());
  } else {
    showGate(true);
  }
})();
</script>
</body>
</html>
